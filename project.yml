name: MagpieTTS
options:
  bundleIdPrefix: com.sdesai.magpie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.30.6"

settings:
  base:
    SWIFT_VERSION: "5.9"

schemes:
  MagpieTTS:
    build:
      targets:
        MagpieTTS: all
    run:
      config: Debug

targets:
  MagpieTTS:
    type: application
    platform: iOS
    sources:
      - path: MagpieTTSApp
      - path: Sources/MagpieTTS
      - path: Shared
    # Models and constants are no longer bundled — they're downloaded from
    # Hugging Face into Application Support on first launch. See
    # MagpieTTSApp/ModelDownloader.swift.
    dependencies:
      - framework: NemoTextProcessing.xcframework
        embed: false
      - package: mlx-swift
        products:
          - MLX
          - MLXNN
          - MLXRandom
      - target: MagpieTTSWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.magpie.tts
        OTHER_LDFLAGS: ["-lopenjtalk", "-lc++"]
        SWIFT_INCLUDE_PATHS: ["$(PROJECT_DIR)/COpenJTalk"]
        INFOPLIST_KEY_CFBundleDisplayName: "Magpie TTS"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(inherited)", "$(PROJECT_DIR)/OpenJTalk.xcframework/ios-arm64"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(PROJECT_DIR)/OpenJTalk.xcframework/ios-arm64-simulator"]
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "$(PROJECT_DIR)/OpenJTalk.xcframework/macos-arm64"]
    info:
      path: MagpieTTSApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true

  MagpieTTSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MagpieTTSWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.magpie.tts.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "MagpieTTS Widgets"
        SKIP_INSTALL: YES
    info:
      path: MagpieTTSWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
